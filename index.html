<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paste Been</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><rect width='120' height='120' rx='28' fill='%231f8a4c'/><g transform='translate(12 12) scale(.8)' fill='none' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'><path d='M78 32V30A12 12 0 0 0 66 18H30A12 12 0 0 0 18 30V66A12 12 0 0 0 30 78H32' stroke='%23fff'/><rect x='42' y='42' width='64' height='64' rx='14' fill='%23fff'/><path d='M59 75L70 86L90 63' stroke='%231f8a4c'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap">
<style>
  :root {
    --bg: #f6f6f4;
    --card: #fff;
    --text: #1c1c1c;
    --muted: #8a8a86;
    --line: #e4e4e0;
    --focus: #1c1c1c;
    --ok: #1f8a4c;
    --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414;
      --card: #1d1d1d;
      --text: #ececea;
      --muted: #8d8d89;
      --line: #2e2e2c;
      --focus: #ececea;
      --ok: #4cc27f;
      --danger: #e0685b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 16px 80px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .brand svg { width: 32px; height: 32px; flex: none; }
  .brand .tick { stroke: var(--ok); }
  .brand h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.04em;
  }
  .box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    transition: border-color .15s;
  }
  .box.editing { border-color: var(--focus); }
  .box { scroll-margin-top: var(--navh, 12px); }
  .box.flash { animation: flash 1s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--focus); } to { box-shadow: 0 0 0 3px transparent; } }
  .title {
    display: block;
    width: 100%;
    padding: 12px 16px 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: 600;
    outline: none;
    text-overflow: ellipsis;
  }
  .title[readonly] { cursor: default; }
  .title::placeholder { color: var(--muted); font-weight: 400; }
  #nav {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 30vh;
    overflow-y: auto;
    margin: 0 -16px 14px;
    padding: 10px 16px;
    background: var(--bg);
  }
  #nav[hidden] { display: none; }
  #nav button {
    height: 28px;
    max-width: 220px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    color: var(--text);
  }
  #nav button:hover { border-color: var(--muted); }
  #nav button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nav button.untitled { color: var(--muted); font-style: italic; }
  textarea {
    display: block;
    width: 100%;
    min-height: 3em;
    padding: 6px 16px 4px;
    border: 0;
    background: transparent;
    color: inherit;
    font: inherit;
    resize: none;
    overflow: hidden;
    outline: none;
  }
  textarea[readonly] { cursor: default; }
  textarea::placeholder { color: var(--muted); }
  .bar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px 8px;
  }
  .bar .spacer { flex: 1; }
  #list { position: relative; }
  .grip {
    padding: 0 6px;
    cursor: grab;
    touch-action: none;
  }
  .box.dragging {
    position: relative;
    z-index: 1;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
  }
  .box.dragging .grip { cursor: grabbing; }
  body.drag { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { color: var(--text); background: var(--bg); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button svg { width: 15px; height: 15px; flex: none; }
  .del { display: none; }
  .box.editing .del { display: inline-flex; }
  .del:hover { color: var(--danger); }
  .copy { color: var(--text); }
  .copy.done { color: var(--ok); }
  #add {
    width: 100%;
    height: 48px;
    justify-content: center;
    border: 1px dashed var(--line);
    border-radius: 10px;
    font-size: 22px;
    font-weight: 300;
  }
  #add:hover { border-color: var(--muted); background: transparent; }
  .io {
    display: flex;
    justify-content: center;
    gap: 4px;
    margin-top: 24px;
  }
  .io button { font-size: 12px; height: 26px; }
</style>
</head>
<body>
<main>
  <header class="brand">
    <svg viewBox="0 0 120 120" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M78 32V30A12 12 0 0 0 66 18H30A12 12 0 0 0 18 30V66A12 12 0 0 0 30 78H32" stroke="currentColor"/>
      <rect x="42" y="42" width="64" height="64" rx="14" fill="currentColor"/>
      <path class="tick" d="M59 75L70 86L90 63"/>
    </svg>
    <h1>paste been</h1>
  </header>
  <nav id="nav" aria-label="Jump to a box" hidden></nav>
  <div id="list"></div>
  <button id="add" aria-label="Add box">+</button>
  <div class="io">
    <button id="export" title="Download all templates as a file">Export</button>
    <button id="import" title="Add templates from an exported file">Import</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
</main>

<template id="tpl">
  <div class="box">
    <input class="title" type="text" placeholder="Untitled" aria-label="Title">
    <textarea spellcheck="true" placeholder="Type or paste a template…"></textarea>
    <div class="bar">
      <button class="grip" title="Drag to reorder (or focus and use ↑ ↓)" aria-label="Reorder box">
        <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="6" cy="4" r="1.2"/><circle cx="10" cy="4" r="1.2"/><circle cx="6" cy="8" r="1.2"/><circle cx="10" cy="8" r="1.2"/><circle cx="6" cy="12" r="1.2"/><circle cx="10" cy="12" r="1.2"/></svg>
      </button>
      <button class="lock"></button>
      <button class="del" title="Delete box">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>
        Delete
      </button>
      <span class="spacer"></span>
      <button class="copy"></button>
    </div>
  </div>
</template>

<script>
(() => {
  const KEY = 'paste-been:v1';
  const list = document.getElementById('list');
  const tpl = document.getElementById('tpl');

  const ICON = {
    locked: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg>',
    editing: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="7" width="9" height="6.5" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 4.9-.7"/></svg>',
    copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1H4a1.5 1.5 0 0 0-1.5 1.5V9a1 1 0 0 0 1 1h.5"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>'
  };

  const nav = document.getElementById('nav');

  // A template is { title, text }. Older saves and exports stored plain strings.
  const norm = t => typeof t === 'string' ? { title: '', text: t }
    : { title: String(t.title ?? ''), text: String(t.text ?? '') };
  const valid = t => typeof t === 'string' ||
    (t && typeof t === 'object' && ['title', 'text'].every(k => t[k] == null || typeof t[k] === 'string'));
  const read = b => ({ title: b.querySelector('.title').value, text: b.querySelector('textarea').value });
  const isEmpty = t => !t.title.trim() && !t.text.trim();

  const load = () => {
    try {
      const d = JSON.parse(localStorage.getItem(KEY));
      return Array.isArray(d) ? d.filter(valid).map(norm) : [];
    } catch { return []; }
  };

  // Jump bar: one chip per box, labelled by its title (or first line if untitled)
  const jump = box => {
    box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    box.classList.remove('flash');
    box.offsetHeight;
    box.classList.add('flash');
  };
  const renderNav = () => {
    const boxes = [...list.children];
    nav.hidden = boxes.length < 2;
    nav.replaceChildren(...boxes.map(box => {
      const { title, text } = read(box);
      const b = document.createElement('button');
      const label = document.createElement('span');
      const first = text.trim().split('\n')[0].slice(0, 60);
      label.textContent = title.trim() || first || 'Untitled';
      b.classList.toggle('untitled', !title.trim());
      b.title = 'Jump to ' + label.textContent;
      b.append(label);
      b.addEventListener('click', () => jump(box));
      return b;
    }));
    list.style.setProperty('--navh', (nav.hidden ? 0 : nav.offsetHeight) + 12 + 'px');
  };

  const save = () => {
    renderNav();
    try { localStorage.setItem(KEY, JSON.stringify([...list.children].map(read))); } catch {}
  };

  const fit = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };

  const setEditing = (box, on) => {
    const ta = box.querySelector('textarea');
    const title = box.querySelector('.title');
    const lock = box.querySelector('.lock');
    box.classList.toggle('editing', on);
    ta.readOnly = title.readOnly = !on;
    title.tabIndex = on ? 0 : -1;
    lock.innerHTML = (on ? ICON.editing + 'Done' : ICON.locked + 'Edit');
    lock.title = on ? 'Lock this box' : 'Unlock to edit';
    if (on && !title.value && !ta.value) title.focus();
    else if (on) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  };

  const copyText = async text => {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      // Fallback for browsers without the async clipboard API
      const t = document.createElement('textarea');
      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      const ok = document.execCommand('copy');
      t.remove(); return ok;
    }
  };

  // Move `box` next to `sib`, sliding `sib` smoothly into its new spot.
  const moveNext = (box, sib, after) => {
    const from = sib.offsetTop;
    after ? sib.after(box) : sib.before(box);
    sib.style.transition = 'none';
    sib.style.transform = `translateY(${from - sib.offsetTop}px)`;
    sib.offsetHeight; // force reflow so the transition runs
    sib.style.transition = 'transform .15s';
    sib.style.transform = '';
  };

  const enableDrag = box => {
    const grip = box.querySelector('.grip');

    // Keyboard: focus the grip and use the arrow keys
    grip.addEventListener('keydown', e => {
      const sib = e.key === 'ArrowUp' ? box.previousElementSibling
                : e.key === 'ArrowDown' ? box.nextElementSibling : null;
      if (!sib) return;
      e.preventDefault();
      moveNext(box, sib, e.key === 'ArrowDown');
      grip.focus();
      save();
    });

    // Mouse / touch / pen
    grip.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      // Listen on window: moving the box in the DOM would drop pointer capture

      const startY = e.clientY + scrollY;
      const startTop = box.offsetTop;
      let clientY = e.clientY, raf;
      box.style.transition = 'none';
      box.classList.add('dragging');
      document.body.classList.add('drag');

      const update = () => {
        const y = clientY + scrollY;
        const listTop = list.getBoundingClientRect().top + scrollY;
        const mid = el => listTop + el.offsetTop + el.offsetHeight / 2;
        let sib;
        while ((sib = box.nextElementSibling) && y > mid(sib)) moveNext(box, sib, true);
        while ((sib = box.previousElementSibling) && y < mid(sib)) moveNext(box, sib, false);
        box.style.transform = `translateY(${y - startY - (box.offsetTop - startTop)}px)`;
      };

      // Scroll the page when dragging near the top or bottom edge
      const tick = () => {
        const edge = 60;
        if (clientY < edge) scrollBy(0, -Math.ceil((edge - clientY) / 4));
        else if (clientY > innerHeight - edge) scrollBy(0, Math.ceil((clientY - innerHeight + edge) / 4));
        update();
        raf = requestAnimationFrame(tick);
      };
      raf = requestAnimationFrame(tick);

      const onMove = ev => { if (ev.pointerId === e.pointerId) { clientY = ev.clientY; update(); } };
      const onEnd = ev => {
        if (ev.pointerId !== e.pointerId) return;
        cancelAnimationFrame(raf);
        removeEventListener('pointermove', onMove);
        removeEventListener('pointerup', onEnd);
        removeEventListener('pointercancel', onEnd);
        document.body.classList.remove('drag');
        box.style.transition = 'transform .15s';
        box.style.transform = '';
        setTimeout(() => { box.classList.remove('dragging'); box.style.transition = ''; }, 150);
        save();
      };
      addEventListener('pointermove', onMove);
      addEventListener('pointerup', onEnd);
      addEventListener('pointercancel', onEnd);
    });
  };

  const make = ({ title = '', text = '' } = {}, editing = false) => {
    const box = tpl.content.firstElementChild.cloneNode(true);
    const ta = box.querySelector('textarea');
    const titleInput = box.querySelector('.title');
    const copy = box.querySelector('.copy');
    ta.value = text;
    titleInput.value = title;
    copy.innerHTML = ICON.copy + 'Copy';

    ta.addEventListener('input', () => { fit(ta); save(); });
    titleInput.addEventListener('input', save);
    // Enter in the title moves on to the text
    titleInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); ta.focus(); }
    });
    enableDrag(box);
    box.querySelector('.lock').addEventListener('click', () =>
      setEditing(box, !box.classList.contains('editing')));
    box.querySelector('.del').addEventListener('click', () => {
      if (!isEmpty(read(box)) && !confirm('Delete this box?')) return;
      box.remove(); save();
    });

    let timer;
    copy.addEventListener('click', async () => {
      const ok = await copyText(ta.value.replace(/\r\n?/g, '\n'));
      clearTimeout(timer);
      copy.classList.toggle('done', ok);
      copy.innerHTML = ok ? ICON.check + 'Copied' : ICON.copy + 'Failed';
      timer = setTimeout(() => {
        copy.classList.remove('done');
        copy.innerHTML = ICON.copy + 'Copy';
      }, 1400);
    });

    list.appendChild(box);
    setEditing(box, editing);
    fit(ta);
    return box;
  };

  const saved = load();
  saved.forEach(t => make(t, false));
  if (!saved.length) make({}, true);
  renderNav();

  document.getElementById('add').addEventListener('click', () => { make({}, true); save(); });
  // Export: download every box as a JSON file. Read-only, changes nothing.
  document.getElementById('export').addEventListener('click', () => {
    const templates = [...list.children].map(read);
    const blob = new Blob([JSON.stringify({ app: 'paste-been', version: 2, templates }, null, 2)],
      { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'paste-been-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // Import: append templates from a file below the existing boxes. Never replaces.
  const file = document.getElementById('file');
  document.getElementById('import').addEventListener('click', () => file.click());
  file.addEventListener('change', async () => {
    const f = file.files[0];
    file.value = '';
    if (!f) return;
    let templates;
    try {
      const data = JSON.parse(await f.text());
      templates = Array.isArray(data) ? data : data.templates;
      if (!Array.isArray(templates) || !templates.every(valid)) throw 0;
    } catch {
      alert("That file doesn't look like a Paste Been export.");
      return;
    }
    // Drop an untouched empty box so imports don't sit below a blank one
    [...list.children].forEach(b => { if (isEmpty(read(b))) b.remove(); });
    templates.map(norm).filter(t => !isEmpty(t)).forEach(t => make(t, false));
    save();
  });

  window.addEventListener('resize', () => { list.querySelectorAll('textarea').forEach(fit); renderNav(); });
})();
</script>
</body>
</html>
